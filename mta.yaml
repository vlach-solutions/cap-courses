_schema-version: 3.3.0
ID: courses-cap
description: A simple CAP project.
version: 1.0.0
modules:
- name: courses-cap-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: courses-cap-auth
  - name: courses-cap-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: courses-cap-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: courses-cap-db
  parameters:
    buildpack: nodejs_buildpack
- name: courses-cap-destination-content
  type: com.sap.application.content
  requires:
  - name: courses-cap-destination-service
    parameters:
      content-target: true
  - name: courses-cap-repo-host
    parameters:
      service-key:
        name: courses-cap-repo-host-key
  - name: courses-cap-auth
    parameters:
      service-key:
        name: courses-cap-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: capcourses_html_repo_host
          ServiceInstanceName: courses-cap-html5-service
          ServiceKeyName: courses-cap-repo-host-key
          sap.cloud.service: capcourses
        - Name: capcourses_uaa
          Authentication: OAuth2UserTokenExchange
          ServiceInstanceName: courses-cap-auth
          ServiceKeyName: courses-cap-auth-key
          sap.cloud.service: capcourses
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: courses-cap-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: courses-cap-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - capcourses.zip
      name: capcourses
      target-path: resources/
- name: capcourses
  type: html5
  path: app/cap-courses
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: courses-cap-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: courses-cap-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: courses-cap-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: courses-cap-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: courses-cap-html5-service
    service-plan: app-host
- name: courses-cap-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: courses-cap-destination-service
    service-plan: lite
  requires:
  - name: srv-api
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
